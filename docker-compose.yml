services:
  cockroach:
    image: cockroachdb/cockroach:latest-v25.3
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data

  bge-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    profiles:
      - embeddings
    command: --model-id BAAI/bge-small-en-v1.5 --port 80
    ports:
      - "8081:80"
    volumes:
      - tei-data:/data

volumes:
  cockroach-data:
  tei-data:
